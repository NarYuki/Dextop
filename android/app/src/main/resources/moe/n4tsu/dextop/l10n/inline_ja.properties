uiWithFullPrivilegeLinuxProgramsRunWithAndroidSElevatedPermissionsTheShellAccessThatUSBDebuggingGrants=特権シェルでは、Linux\ のプログラムが\ Android\ の上位権限（USB\ デバッグと同等のシェル権限）で動きます。通常のアプリ権限では動かない、デバイスの深い機能を使うアプリやツールも実行できるようになります。\n\nその一方で、悪意のあるプログラムがコンテナに紛れ込んだ場合（パッケージ、スクリプト、AppImage、ゲームなど）、その上位権限を使って、あなたのデバイスで次のようなことをされるおそれがあります。\n・アプリの無断インストールや削除\n・画面の撮影や、タップ・キー入力の操作\n・他のアプリのログやストレージ内のファイルの読み取り\n・システム設定の変更\n・Linux\ のキーリングに保存したパスワードや、ほかの特権アプリからの盗み見\n\n信頼できる配布元のソフトウェアだけを入れてください。出どころの分からないソフトウェアを試すときは、一般権限での実行をおすすめします。
