uiWithFullPrivilegeLinuxProgramsRunWithAndroidSElevatedPermissionsTheShellAccessThatUSBDebuggingGrants=С\ полными\ привилегиями\ программы\ Linux\ работают\ с\ повышенными\ правами\ Android\ (доступ\ shell\ через\ USB-отладку).\ Это\ позволяет\ запускать\ приложения\ и\ инструменты,\ которым\ нужен\ более\ глубокий\ доступ\ к\ устройству,\ недоступный\ обычным\ приложениям.\n\nОднако\ вредоносная\ программа\ в\ контейнере\ (пакет,\ скрипт,\ AppImage,\ игра…)\ может\ использовать\ эти\ права\ во\ вред,\ например\:\n•\ устанавливать\ и\ удалять\ приложения\ без\ запроса\n•\ снимать\ экран,\ выполнять\ нажатия\ и\ ввод\n•\ читать\ журналы\ других\ приложений\ и\ файлы\ хранилища\n•\ менять\ системные\ настройки\n•\ читать\ пароли\ связки\ ключей\ Linux\ или\ допускать\ наблюдение\ другими\ привилегированными\ приложениями\n\nУстанавливайте\ ПО\ только\ из\ доверенных\ источников.\ Неизвестное\ ПО\ проверяйте\ в\ режиме\ Android\ с\ обычными\ правами\ приложения.
