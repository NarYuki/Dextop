uiWithFullPrivilegeLinuxProgramsRunWithAndroidSElevatedPermissionsTheShellAccessThatUSBDebuggingGrants=Com\ privilégios\ completos,\ os\ programas\ Linux\ executam\ com\ permissões\ elevadas\ do\ Android\ (acesso\ shell\ concedido\ pela\ depuração\ USB).\ Isto\ permite\ usar\ aplicações\ e\ ferramentas\ que\ precisam\ de\ maior\ acesso\ ao\ dispositivo,\ impossível\ com\ permissões\ normais.\n\nPorém,\ um\ programa\ malicioso\ no\ contentor\ (pacote,\ script,\ AppImage,\ jogo…)\ pode\ abusar\ dessas\ permissões\ e\ causar\ problemas\ de\ segurança,\ como\:\n•\ instalar\ ou\ remover\ aplicações\ sem\ perguntar\n•\ capturar\ o\ ecrã\ ou\ simular\ toques\ e\ escrita\n•\ ler\ registos\ de\ outras\ aplicações\ e\ ficheiros\ no\ armazenamento\n•\ alterar\ definições\ do\ sistema\n•\ ler\ palavras-passe\ do\ chaveiro\ Linux\ ou\ permitir\ vigilância\ por\ outras\ aplicações\ privilegiadas\n\nInstale\ software\ apenas\ de\ fontes\ de\ confiança.\ Para\ experimentar\ software\ desconhecido,\ execute\ o\ Linux\ no\ modo\ Android\ (permissões\ normais\ de\ aplicação).
