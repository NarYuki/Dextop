uiWithFullPrivilegeLinuxProgramsRunWithAndroidSElevatedPermissionsTheShellAccessThatUSBDebuggingGrants=Com\ privilégios\ completos,\ os\ programas\ Linux\ executam\ com\ permissões\ elevadas\ do\ Android\ (acesso\ shell\ concedido\ pela\ depuração\ USB).\ Isso\ permite\ usar\ aplicativos\ e\ ferramentas\ que\ precisam\ de\ maior\ acesso\ ao\ dispositivo,\ impossível\ com\ permissões\ normais.\n\nPorém,\ um\ programa\ malicioso\ no\ contêiner\ (pacote,\ script,\ AppImage,\ jogo…)\ pode\ abusar\ dessas\ permissões\ e\ causar\ problemas\ de\ segurança,\ como\:\n•\ instalar\ ou\ remover\ aplicativos\ sem\ perguntar\n•\ capturar\ a\ tela\ ou\ simular\ toques\ e\ digitação\n•\ ler\ logs\ de\ outros\ aplicativos\ e\ arquivos\ no\ armazenamento\n•\ alterar\ configurações\ do\ sistema\n•\ ler\ senhas\ do\ chaveiro\ Linux\ ou\ permitir\ vigilância\ por\ outros\ aplicativos\ privilegiados\n\nInstale\ software\ apenas\ de\ fontes\ confiáveis.\ Para\ experimentar\ software\ desconhecido,\ execute\ o\ Linux\ no\ modo\ Android\ (permissões\ normais\ de\ aplicativo).
