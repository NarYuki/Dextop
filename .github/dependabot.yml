version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Android Gradle Plugin, Kotlin and Gradle must match the pinned Flutter
      # release; major moves are done by hand together with a Flutter upgrade.
      - dependency-name: com.android.*
        update-types: [version-update:semver-major]
      - dependency-name: org.jetbrains.kotlin*
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    commit-message:
      prefix: ci(deps)
    groups:
      github-actions:
        patterns: ["*"]
