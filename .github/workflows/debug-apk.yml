name: Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testGithubDebugUnitTest

      - name: Build Debug APK
        run: flutter build apk --flavor github --debug --dart-define=DISTRIBUTION_CHANNEL=github

      - name: Build Dextop Car Companion Debug APK
        working-directory: android
        run: ./gradlew :cardex:assembleDebug

      - name: Upload Nightly APKs
        uses: actions/upload-artifact@v4
        with:
          name: dextop-nightly-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-github-debug.apk
            build/cardex/outputs/apk/debug/cardex-debug.apk
          if-no-files-found: error
          retention-days: 14
