name: Debug APK

# Nightly APKs from main. Pull requests are checked by pr-checks.yml without building.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build
    # Gradle needs several GB: Android jobs share one runner so they never run side by side.
    runs-on: [self-hosted, android]
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check UI localization
        run: python3 tool/check_localization.py

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Run Linux helper tests
        run: python3 -m unittest discover -s tool/tests -p 'test_*.py'

      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew :app:testGithubDebugUnitTest :cardex:testDebugUnitTest

      - name: Build Debug APK
        run: flutter build apk --flavor github --debug --dart-define=DISTRIBUTION_CHANNEL=github

      - name: Build Parking and Driving Debug APKs
        working-directory: android
        run: ./gradlew :cardex:assembleDebug :cardexdriving:assembleDebug

      - name: Check packaged UI localization
        run: >-
          python3 tool/check_apk_localization.py
          --app build/app/outputs/flutter-apk/app-github-debug.apk
          --companion build/cardex/outputs/apk/debug/cardex-debug.apk
          build/cardexdriving/outputs/apk/debug/cardexdriving-debug.apk

      - name: Upload Nightly APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dextop-nightly-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-github-debug.apk
            build/cardex/outputs/apk/debug/cardex-debug.apk
            build/cardexdriving/outputs/apk/debug/cardexdriving-debug.apk
          if-no-files-found: error
          retention-days: 14
