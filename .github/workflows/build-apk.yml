name: Build Flutter APK

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.0'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # Checkout repository
    - name: Checkout code
      uses: actions/checkout@v4

    # Setup Java
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'

    # Setup Flutter (use latest stable matching pubspec constraints)
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true
        # Let it auto-resolve the version from pubspec.yaml

    # Cache dependencies
    - name: Cache pub dependencies
      uses: actions/cache@v4
      with:
        path: ${{ env.PUB_CACHE }}
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-

    # Install dependencies
    - name: Get dependencies
      run: flutter pub get

    # Analyze code (treat infos as warnings only, not fatal)
    - name: Analyze code
      run: flutter analyze || echo "Analysis warnings found, continuing..."

    # Run tests (if any exist)
    - name: Run tests
      run: flutter test || echo "No tests found, skipping..."

    # Build APK using Gradle directly
    - name: Build APK (Github Debug)
      run: |
        cd android
        ./gradlew assembleGithubDebug

    # Show output
    - name: Show APK location
      run: |
        echo "=== APK output locations ==="
        find build -name "*.apk" -o -name "*.aab" | head -20
        ls -lah build/app/outputs/ 2>/dev/null || echo "outputs not found"
        ls -lah build/outputs/ 2>/dev/null || echo "build/outputs not found"

    # Upload main APK as artifact
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: dextop-github-debug
        path: android/build/outputs/apk/github/debug/*.apk
        retention-days: 30

    # Create release on GitHub (only on main branch pushes)
    - name: Create Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        files: android/build/outputs/apk/github/debug/*.apk
        tag_name: v${{ github.run_number }}-debug
        name: Dextop Debug ${{ github.run_number }}
        body: |
          ## Dextop APK Debug
          
          ### Changes in this version:
          - Mobile data support added
          
          ### APK File:
          `app-github-debug.apk` - Debug build (github flavor)
          
          ### Installation:
          Download the appropriate APK for your device architecture.
          
          Built from commit: ${{ github.sha }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
