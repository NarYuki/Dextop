name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # With a GitHub App configured (DEXTOP_BOT_APP_ID / DEXTOP_BOT_PRIVATE_KEY), release
      # PRs come from the app's bot account and trigger CI. Without it they come from
      # github-actions[bot], whose PRs do not start other workflows.
      - name: Create GitHub App token
        id: app-token
        if: vars.DEXTOP_BOT_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DEXTOP_BOT_APP_ID }}
          private-key: ${{ secrets.DEXTOP_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
