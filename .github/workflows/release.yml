name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    name: Update the release pull request
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      # Optional: a GitHub App (variable DEXTOP_RELEASE_APP_ID, secret
      # DEXTOP_RELEASE_APP_KEY) opens the release pull request under its own name,
      # so the Debug APK workflow runs on it. Pull requests opened with the default
      # token do not start other workflows.
      - name: Get the release app's token
        id: app
        if: vars.DEXTOP_RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DEXTOP_RELEASE_APP_ID }}
          private-key: ${{ secrets.DEXTOP_RELEASE_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

      # Release Please's Dart updater cannot read a pre-release version: from
      # "2.0.0-beta.1+42" it writes "2.0.0-beta.2+-beta.1+42". Write the version
      # line of the release pull request as "<next version>+<main's build + 1>".
      # Runs every time: Release Please reports the pull request only when it rewrites it.
      - name: Fix the version line of the release pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          API: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          BASE: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, urllib.parse, urllib.request

          api = f"{os.environ['API']}/repos/{os.environ['REPOSITORY']}"
          headers = {'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                     'Accept': 'application/vnd.github+json'}

          def call(method, url, body=None):
              data = json.dumps(body).encode() if body is not None else None
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read() or 'null')

          def read(path, ref):
              item = call('GET', f"{api}/contents/{path}?ref={urllib.parse.quote(ref, safe='')}")
              return base64.b64decode(item['content']).decode(), item['sha']

          owner = os.environ['REPOSITORY'].split('/')[0]
          branch = 'release-please--branches--main--components--dextop'
          if not call('GET', f"{api}/pulls?state=open&head={owner}:{branch}"):
              print('no open release pull request')
              raise SystemExit(0)
          version = json.loads(read('.github/release-please/manifest.json', branch)[0])['.']
          base_pubspec = read('pubspec.yaml', os.environ['BASE'])[0]
          build = int(re.search(r'^version:\s*\S*?\+(\d+)\s*$', base_pubspec, re.M).group(1))
          wanted = f'version: {version}+{build + 1}'

          pubspec, sha = read('pubspec.yaml', branch)
          fixed = re.sub(r'^version:.*$', wanted, pubspec, count=1, flags=re.M)
          if fixed == pubspec:
              print(f'{wanted}: already set')
          else:
              call('PUT', f'{api}/contents/pubspec.yaml', {
                  'message': f'chore: set version {version}+{build + 1}',
                  'content': base64.b64encode(fixed.encode()).decode(),
                  'sha': sha, 'branch': branch})
              print(f'set {wanted}')
          PY
