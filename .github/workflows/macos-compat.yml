name: macOS compatibility ARM64 core

on:
  push:
    branches: [feat/macos-compat]
    paths:
      - tool/macos/**
      - .github/workflows/macos-compat.yml
  workflow_dispatch:
    inputs:
      components:
        description: Runtime components to build
        type: choice
        options: [core, gui]
        default: core

permissions:
  contents: read

concurrency:
  group: macos-${{ inputs.components || 'core' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      MACOS_COMPONENTS: ${{ inputs.components || 'core' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the execution wrapper
        run: python3 -m unittest discover -s tool/macos/tests -v
      - name: Install ARM64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git git-lfs cmake ninja-build clang lld llvm-dev bison flex pkg-config python3 patchelf \
            libfuse-dev libudev-dev libcairo2-dev libgl1-mesa-dev libtiff-dev \
            libfreetype-dev libelf-dev libxml2-dev libegl1-mesa-dev libglu1-mesa-dev \
            libfontconfig-dev libbsd-dev libxrandr-dev libxcursor-dev libgif-dev \
            libavcodec-dev libavformat-dev libswresample-dev libavutil-dev \
            libpulse-dev libdbus-1-dev libxkbfile-dev libcap-dev libvulkan-dev \
            libwayland-dev libxkbcommon-dev libssl-dev wayland-protocols python3-xlib
      - name: Build own-source Mach-O probes
        run: |
          linker="$(llvm-config --bindir)/ld64.lld"
          for probe in hello posix socket; do
            python3 tool/macos/build_smoke.py --clang /usr/bin/clang --linker "$linker" --probe "$probe"
          done
      - name: Build the pinned core
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: |
          set -o pipefail
          if [ "$MACOS_COMPONENTS" = gui ]; then
            rustup toolchain install 1.98.1 --profile minimal
          fi
          mkdir -p build/macos
          python3 tool/macos/build_runtime.py --jobs 2 --components "$MACOS_COMPONENTS" 2>&1 | tee build/macos/core-build.log
      - name: Build the own-source AppKit probe
        if: env.MACOS_COMPONENTS == 'gui'
        run: |
          python3 tool/macos/build_appkit_probe.py \
            --source build/macos/runtime/source \
            --runtime build/macos/runtime/stage/opt/dextop/macos \
            --clang /usr/bin/clang --linker "$(llvm-config --bindir)/ld64.lld" \
            --output build/macos/gui-probes
      - name: Verify own-source Mach-O programs on Linux ARM64
        run: |
          python3 tool/macos/check_runtime.py \
            --runtime build/macos/runtime/stage/opt/dextop/macos \
            --probes build/macos/smoke --output build/macos/native-smoke
          python3 tool/macos/check_runtime.py --anonymous-exec \
            --runtime build/macos/runtime/stage/opt/dextop/macos \
            --probes build/macos/smoke --output build/macos/native-anon-smoke
          cc -shared -fPIC -O2 tool/macos/tests/abstract_server.c -o build/macos/abstract-server.so
          LD_PRELOAD="$PWD/build/macos/abstract-server.so" DEXTOP_SOCKET_NS=dextop-ci DEXTOP_TEST_DENY_PID_NAMESPACE=1 \
            python3 tool/macos/check_runtime.py --abstract-rpc --anonymous-exec \
            --runtime build/macos/runtime/stage/opt/dextop/macos \
            --probes build/macos/smoke --output build/macos/native-abstract-smoke
      - name: Verify calendar, layout, view backing and EventKit API behavior
        if: env.MACOS_COMPONENTS == 'gui'
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          for probe in calendar layout_fitting eventkit view_backing controller_appearance grid layer_render unarchiver presentation calibrated_rgb accessibility_chart gradient_layer timing_function; do
            python3 tool/macos/build_appkit_probe.py --probe "$probe" \
              --source build/macos/runtime/source \
              --runtime build/macos/runtime/stage/opt/dextop/macos \
              --clang /usr/bin/clang --linker "$(llvm-config --bindir)/ld64.lld" \
              --output build/macos/gui-probes
          done
          xvfb-run -a python3 tool/macos/check_runtime.py --abstract-rpc --anonymous-exec \
            --probe calendar --probe layout_fitting --probe eventkit --probe view_backing --probe controller_appearance --probe grid --probe layer_render --probe unarchiver --probe calibrated_rgb --probe accessibility_chart --probe gradient_layer --probe timing_function \
            --runtime build/macos/runtime/stage/opt/dextop/macos \
            --probes build/macos/gui-probes --output build/macos/gui-api-smoke
          xvfb-run -a python3 tool/macos/check_presentation.py \
            --runtime build/macos/runtime/stage/opt/dextop/macos \
            --prefix build/macos/presentation-prefix \
            --executable build/macos/gui-probes/presentation-macos-arm64 \
            --log build/macos/native-presentation.log
      - name: Build and verify AudioToolbox conversion
        if: env.MACOS_COMPONENTS == 'gui'
        run: |
          python3 tool/macos/build_audio_probe.py \
            --source build/macos/runtime/source \
            --runtime build/macos/runtime/stage/opt/dextop/macos \
            --clang /usr/bin/clang --linker "$(llvm-config --bindir)/ld64.lld" \
            --output build/macos/audio-probes
          python3 tool/macos/check_runtime.py --probe audio \
            --runtime build/macos/runtime/stage/opt/dextop/macos \
            --probes build/macos/audio-probes --output build/macos/native-audio-smoke
      - name: Verify GUI host library dependencies
        if: env.MACOS_COMPONENTS == 'gui'
        run: |
          python3 tool/macos/check_native.py \
            --runtime build/macos/runtime/stage/opt/dextop/macos \
            --output build/macos/native-dependencies.json
      - name: Package verified build with runtime inventory
        run: |
          set -o pipefail
          python3 tool/macos/runtime_archive.py package \
            --runtime build/macos/runtime/stage/opt/dextop/macos \
            --metadata build/macos/runtime/build-info.json \
            --output "build/macos/darling-$MACOS_COMPONENTS-arm64.tar.gz" \
            | tee build/macos/runtime-package.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darling-${{ env.MACOS_COMPONENTS }}-arm64-${{ github.sha }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            build/macos/core-build.log
            build/macos/runtime/build-info.json
            build/macos/runtime/submodules.txt
            build/macos/darling-*-arm64.tar.gz
            build/macos/runtime-package.json
            build/macos/native-dependencies.json
            build/macos/native-audio-smoke
            build/macos/audio-probes/*-macos-arm64
            build/macos/native-smoke
            build/macos/native-anon-smoke
            build/macos/native-abstract-smoke
            build/macos/smoke/*-macos-arm64
            build/macos/gui-probes/*-macos-arm64
            build/macos/gui-api-smoke
