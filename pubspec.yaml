name: free_dextop
description: Turn an Android device into a flexible desktop workspace.
publish_to: none
version: 2.0.0-beta.2+43

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.5
  firebase_core: ^4.2.1
  firebase_analytics: ^12.0.4
  in_app_update: ^4.2.5
  archive: ^4.0.7
  file_picker: ^10.3.3
  share_plus: ^12.0.1
  material_3_expressive: 1.2.0
  material_ui: 1.8.0

# material_3_expressive with Dextop's patch (third_party/README.md).
dependency_overrides:
  material_3_expressive:
    path: third_party/material_3_expressive

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/dextop_icon.png
    - assets/setup_tutorial/
    - LICENSE
    - android/app/src/main/assets/terminal/LICENSE
    - android/app/src/main/assets/terminal/LICENSE-DextopTermMono
    - android/app/src/main/assets/terminal/LICENSE-SymbolsNerdFont
    - android/app/src/main/res/raw/swipe_lexicons_notice.txt
    - third_party/adrenotools/LICENSE
    - third_party/adrenotools/lib/linkernsbypass/LICENSE
    - third_party/dd-turnip/LICENSES/GPL-3.0.txt
    - third_party/dd-turnip/LICENSES/mesa/MIT
    - third_party/dd-turnip/LICENSES/mesa/license.rst
    - third_party/dd-turnip/NOTICE
    - third_party/deck-audio/COPYING
    - third_party/deck-audio/LIBFFI-LICENSE
    - third_party/deck-audio/NOTICE.md
    - third_party/deck-audio/PULSEAUDIO-LICENSE
    - third_party/deck-direct/NOTICE.md
    - third_party/deck-gamescope/GAMESCOPE-LICENSE
    - third_party/deck-gamescope/NOTICE.md
    - third_party/droiddeck-fastpath/LICENSE
    - third_party/libepoxy/COPYING
    - third_party/libffi/LICENSE
    - third_party/licenses/0BSD-xz-java.txt
    - third_party/licenses/Apache-2.0.txt
    - third_party/licenses/MIT-usb-serial-for-android.txt
    - third_party/licenses/SOURCE.txt
    - third_party/proot/COPYING
    - third_party/talloc/COPYING
    - third_party/virglrenderer/COPYING
    - third_party/vulkan-headers/LICENSE.md
    - third_party/wayland-protocols/COPYING
    - third_party/wayland/COPYING
    - third_party/zstd/LICENSE
