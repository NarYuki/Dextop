name: free_dextop
description: Turn an Android device into a flexible desktop workspace.
publish_to: none
version: 1.2.1+9

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  firebase_core: ^4.2.1
  firebase_analytics: ^12.0.4
  in_app_update: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/dextop_icon.png
