# Parked App verification: wide landscape car display.
# The 596px top/bottom margins reproduce the canonical wide DHU profile.

[general]
inputmode = touch
touch = true
touchpad = false
touchpadnavigation = false
controller = false
instrumentcluster = false
resolution = 1920x1080
dpi = 160
realdpi = 160
normalizedpi = true
framerate = 30
marginheight = 596
marginwidth = 0
cropmargins = true
driverposition = center

[sensors]
driving_status = true
parking_brake = true
gear = true
speed = true
