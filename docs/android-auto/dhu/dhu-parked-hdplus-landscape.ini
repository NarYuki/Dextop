# Parked App verification: HD+ (1600x900) landscape head unit.
# DHU accepts only 800x480, 1280x720 and 1920x1080 streams (4K is rejected), so a
# 1920x1080 stream is cropped by 160px left/right and 90px top/bottom to 1600x900.

[general]
inputmode = touch
touch = true
touchpad = false
touchpadnavigation = false
controller = false
instrumentcluster = false
resolution = 1920x1080
dpi = 160
realdpi = 160
normalizedpi = true
framerate = 30
marginwidth = 320
marginheight = 180
cropmargins = true
driverposition = center

[sensors]
driving_status = true
parking_brake = true
gear = true
speed = true
