# Parked App verification: extra-tall portrait car display.
# A 600x1080 center region is cropped from a supported 1920x1080 stream.

[general]
inputmode = touch
touch = true
touchpad = false
touchpadnavigation = false
controller = false
instrumentcluster = false
resolution = 1920x1080
dpi = 160
realdpi = 160
normalizedpi = true
framerate = 30
marginwidth = 1320
marginheight = 0
cropmargins = true
driverposition = center

[sensors]
driving_status = true
parking_brake = true
gear = true
speed = true
