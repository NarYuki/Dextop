# Parked App verification: tall portrait head unit (Subaru-style layout).
# DHU requests a supported 1920x1080 stream and crops it to a portrait center region.

[general]
inputmode = touch
touch = true
touchpad = false
touchpadnavigation = false
controller = false
instrumentcluster = false
resolution = 1920x1080
dpi = 160
realdpi = 160
normalizedpi = true
framerate = 30
marginwidth = 878
marginheight = 0
cropmargins = true
driverposition = center

[sensors]
driving_status = true
parking_brake = true
gear = true
speed = true
