# Parked App verification: standard Android Auto head unit.

[general]
inputmode = touch
touch = true
touchpad = false
touchpadnavigation = false
controller = false
instrumentcluster = false
resolution = 800x480
dpi = 160
realdpi = 160
normalizedpi = false
framerate = 30
driverposition = center

[sensors]
driving_status = true
parking_brake = true
gear = true
speed = true
